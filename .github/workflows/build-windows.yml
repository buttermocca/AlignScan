name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt pyinstaller
      - name: Test document detection and image tuning
        run: python -m pytest -q
      - name: Generate mascot and app icon
        run: python -c "from alignscan.asset_generator import ensure_assets; ensure_assets('assets')"
      - name: Build fast-start Windows application folder
        shell: cmd
        run: pyinstaller --noconfirm --clean --windowed --onedir --name AlignScan --icon assets\app_icon.ico --add-data "assets;assets" --collect-all PySide6 --collect-all cv2 --collect-all onnxruntime --exclude-module matplotlib --exclude-module scipy --exclude-module torch --exclude-module torchvision --exclude-module ultralytics app.py
      - name: Include quick start guide
        run: Copy-Item README.md dist/AlignScan/README.txt
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AlignScan-Windows-x64-FastStart
          path: dist/AlignScan/**
          if-no-files-found: error
          retention-days: 30
